<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="以数据可视化叙事呈现人工智能作为新质生产力的作用和意义" />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>智能涌现 · AI 新质生产力</title>
    <script>
      // 首帧前应用已保存的主题，避免闪烁
      try {
        var t = localStorage.getItem('aiqp-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        document.documentElement.lang = localStorage.getItem('aiqp-lang') === 'en' ? 'en' : 'zh-CN';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
